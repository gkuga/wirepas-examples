<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
	<!-- Same policy as upstream sink_service/com.wirepas.sink.conf: only the
	     wirepas user may own a sink name. Every container here therefore runs
	     as wirepas, uid 1000. -->
	<policy user="wirepas">
		<allow own_prefix="com.wirepas.sink"/>
		<allow send_type="method_call"/>
	</policy>
</busconfig>
